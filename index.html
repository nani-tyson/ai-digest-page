<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Digest Tracker</title>
<style>
  :root { --bg:#fff; --fg:#111; --mute:#666; --line:#e5e5e5; --link:#1a56db; --chip:#f1f3f5; --ok:#15803d; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#111; --fg:#eee; --mute:#999; --line:#2a2a2a; --link:#7aa2ff; --chip:#1f1f1f; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 -apple-system, Segoe UI, Helvetica, Arial, sans-serif; }
  main { max-width:720px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; margin:8px 0 2px; } h2 { font-size:15px; text-transform:uppercase; letter-spacing:.04em; color:var(--mute); margin:28px 0 8px; }
  a { color:var(--link); text-decoration:none; } a:hover { text-decoration:underline; }
  .item { padding:10px 0; border-bottom:1px solid var(--line); }
  .meta { color:var(--mute); font-size:13px; } .why { display:block; margin-top:2px; }
  .chip { display:inline-block; background:var(--chip); border-radius:10px; padding:1px 8px; font-size:12px; margin-right:6px; }
  button { font:inherit; font-size:13px; padding:3px 10px; border:1px solid var(--line); background:var(--chip); color:var(--fg); border-radius:6px; cursor:pointer; margin:6px 6px 0 0; }
  button:hover { border-color:var(--mute); }
  #token { width:100%; box-sizing:border-box; padding:8px; border:1px solid var(--line); border-radius:6px; background:var(--chip); color:var(--fg); }
  #status { font-size:13px; color:var(--mute); min-height:1.2em; margin-top:6px; }
  .due { color:#b45309; font-weight:600; }
  .empty { color:var(--mute); font-style:italic; }
</style>
</head>
<body>
<main>
  <h1>AI Digest Tracker</h1>
  <div class="meta" id="head">loading…</div>
  <div id="status"></div>

  <h2>Due for review</h2><div id="due"></div>
  <h2>Learning now</h2><div id="learning"></div>
  <h2>Queue</h2><div id="queued"></div>
  <h2>Latest digest</h2><div id="latest"></div>
  <h2>Done</h2><div id="done"></div>

  <h2>Settings</h2>
  <p class="meta">A fine-grained GitHub token with <b>Contents: read and write</b> on this repo only. Stored in this browser, sent only to api.github.com.</p>
  <input id="token" type="password" placeholder="github_pat_…" autocomplete="off">
  <button onclick="saveToken()">Save token</button>
  <button onclick="localStorage.removeItem('gh_token');location.reload()">Forget</button>
</main>
<script>
const OWNER = "nani-tyson", REPO = "ai-digest", BRANCH = "main";
const REVIEW_DAYS = [2, 7, 21];
const API = `https://api.github.com/repos/${OWNER}/${REPO}/contents/data/`;
let token = null, queue = [], latest = {}, queueSha = null;
try { token = localStorage.getItem("gh_token"); } catch (e) {}

const today = () => new Date().toISOString().slice(0, 10);
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x.toISOString().slice(0, 10); };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const say = m => document.getElementById("status").textContent = m;

async function readFile(name) {
  if (token) {
    const r = await fetch(API + name + "?ref=" + BRANCH, { headers: { Authorization: "Bearer " + token, Accept: "application/vnd.github+json" } });
    if (!r.ok) throw new Error(name + " " + r.status);
    const j = await r.json();
    const text = decodeURIComponent(escape(atob(j.content.replace(/\n/g, ""))));
    return { data: JSON.parse(text), sha: j.sha };
  }
  const r = await fetch("data/" + name + "?t=" + Date.now());
  if (!r.ok) throw new Error(name + " " + r.status + " (no token and page not served next to data/)");
  return { data: await r.json(), sha: null };
}

async function writeQueue(message) {
  if (!token) { say("Save a GitHub token below to record progress."); return false; }
  const body = JSON.stringify(queue, null, 1) + "\n";
  const r = await fetch(API + "queue.json", { method: "PUT",
    headers: { Authorization: "Bearer " + token, Accept: "application/vnd.github+json", "Content-Type": "application/json" },
    body: JSON.stringify({ message, branch: BRANCH, sha: queueSha, content: btoa(unescape(encodeURIComponent(body))) }) });
  if (!r.ok) { say("Save failed: " + r.status + " (reload and retry)"); return false; }
  queueSha = (await r.json()).content.sha;
  say("Saved " + new Date().toLocaleTimeString());
  return true;
}

function act(id, action) {
  const q = queue.find(x => x.id === id); if (!q) return;
  const t = today();
  if (action === "start") { q.status = "learning"; q.started = t; q.stage = 0; q.next_review = addDays(t, REVIEW_DAYS[0]); }
  if (action === "reviewed") {
    q.stage = (q.stage ?? 0) + 1;
    if (q.stage >= REVIEW_DAYS.length) { q.status = "done"; q.done = t; delete q.next_review; }
    else q.next_review = addDays(t, REVIEW_DAYS[q.stage]);
  }
  if (action === "done") { q.status = "done"; q.done = t; delete q.next_review; }
  if (action === "skip") { q.status = "skipped"; q.done = t; delete q.next_review; }
  if (action === "requeue") { q.status = "queued"; delete q.next_review; delete q.done; }
  render();
  writeQueue(`${action}: ${q.title.slice(0, 50)}`);
}

function row(q, buttons) {
  const chips = [q.effort, q.source].filter(Boolean).map(c => `<span class="chip">${esc(c)}</span>`).join("");
  const due = q.next_review ? `<span class="${q.next_review <= today() ? "due" : "meta"}">review ${esc(q.next_review)}</span>` : "";
  const href = /^https?:\/\//i.test(q.url || "") ? q.url : "#";  // feed URLs are untrusted; the token lives on this origin
  return `<div class="item"><a href="${esc(href)}" target="_blank" rel="noopener">${esc(q.title)}</a>
    <div class="meta">${chips}${due}${q.why ? `<span class="why">${esc(q.why)}</span>` : ""}</div>
    ${buttons.map(([label, a]) => `<button onclick="act('${q.id}','${a}')">${label}</button>`).join("")}</div>`;
}

function list(el, items, buttons) {
  document.getElementById(el).innerHTML = items.length ? items.map(q => row(q, buttons)).join("") : `<div class="empty">nothing here</div>`;
}

function render() {
  const t = today();
  const learning = queue.filter(q => q.status === "learning");
  list("due", learning.filter(q => q.next_review && q.next_review <= t), [["Reviewed", "reviewed"], ["Done", "done"], ["Drop", "skip"]]);
  list("learning", learning.filter(q => !(q.next_review && q.next_review <= t)), [["Reviewed early", "reviewed"], ["Done", "done"], ["Drop", "skip"]]);
  list("queued", queue.filter(q => q.status === "queued").reverse(), [["Start", "start"], ["Done", "done"], ["Skip", "skip"]]);
  list("done", queue.filter(q => q.status === "done" || q.status === "skipped").reverse().slice(0, 30), [["Requeue", "requeue"]]);
  const s = latest.sections || {};
  const inQueue = new Set(queue.map(q => q.id));
  const sec = (name, items) => items && items.length ? `<div class="meta" style="margin-top:10px"><b>${name}</b></div>` +
    items.map(i => row({ ...i }, inQueue.has(i.id) ? [] : [["Add to queue", "add:" + i.id]])).join("") : "";
  document.getElementById("latest").innerHTML = latest.date
    ? `<div class="meta">${esc(latest.date)} · ${esc(latest.subject || latest.mode)}</div>${sec("Urgent", s.urgent)}${sec("Learn", s.learn)}${sec("Worth knowing", s.aware)}`
    : `<div class="empty">no digest yet</div>`;
  document.getElementById("head").textContent = `${queue.filter(q => q.status === "queued").length} queued · ${learning.length} learning · ${queue.filter(q => q.status === "done").length} done` + (token ? "" : " · read-only (no token)");
}

// "Add to queue" from the latest digest uses the act() channel with an add: prefix
const _act = act;
act = (id, action) => {
  if (action.startsWith("add:")) {
    const all = Object.values(latest.sections || {}).flat();
    const i = all.find(x => x.id === action.slice(4));
    if (i && !queue.find(q => q.id === i.id)) { queue.push({ ...i, added: today(), status: "queued" }); render(); writeQueue("add: " + i.title.slice(0, 50)); }
    return;
  }
  _act(id, action);
};

function saveToken() {
  const v = document.getElementById("token").value.trim();
  if (!v) return;
  try { localStorage.setItem("gh_token", v); } catch (e) { say("This browser blocks storage; token kept for this page load only."); }
  token = v; load();
}

async function load() {
  try {
    const [q, l] = await Promise.all([readFile("queue.json"), readFile("latest.json")]);
    queue = q.data; queueSha = q.sha; latest = l.data; render(); say("");
  } catch (e) { say("Load failed: " + e.message); document.getElementById("head").textContent = ""; }
}
load();
</script>
</body>
</html>
